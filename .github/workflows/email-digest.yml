name: Email VPR digest

on:
  push:
    branches: [main]
    paths:
      - 'digests/**'
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the per-run email file (only this run's new papers)
        id: pick
        run: |
          f="digests/_email.md"
          if [ ! -s "$f" ]; then
            echo "No _email.md (no new papers this run); nothing to send."
            echo "found=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=1" >> "$GITHUB_OUTPUT"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: steps.pick.outputs.found == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[VPR Radar] ${{ steps.pick.outputs.date }} 新论文"
          to: ziningl@mit.edu
          from: VPR Paper Radar <${{ secrets.MAIL_USERNAME }}>
          reply_to: ${{ secrets.MAIL_USERNAME }}
          body: file://${{ steps.pick.outputs.file }}
          html_body: file://${{ steps.pick.outputs.file }}
          convert_markdown: true
